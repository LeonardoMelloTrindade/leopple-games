name: 🤖 AI Code Review & Security Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: npm run lint 2>&1 || echo "LINT_FAILED=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check TypeScript types
        id: typescript
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Security audit
        id: audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 🤖 Post AI Analysis Comment (Portuguese)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const eslintPassed = '${{ steps.eslint.outcome }}' === 'success';
            const typesPassed = '${{ steps.typescript.outcome }}' === 'success';
            const auditPassed = '${{ steps.audit.outcome }}' === 'success';

            let comment = `## 🤖 Análise de Revisão de Código\n\n`;
            comment += `| Verificação | Status |\n`;
            comment += `|-------------|--------|\n`;
            comment += `| 📝 ESLint | ${eslintPassed ? '✅ Aprovado' : '⚠️ Problemas Encontrados'} |\n`;
            comment += `| 🔧 TypeScript | ${typesPassed ? '✅ Aprovado' : '❌ Erros de Tipo'} |\n`;
            comment += `| 🛡️ Auditoria de Segurança | ${auditPassed ? '✅ Aprovado' : '⚠️ Vulnerabilidades'} |\n\n`;

            if (!eslintPassed || !typesPassed || !auditPassed) {
              comment += `### ⚠️ Melhorias Necessárias\n\n`;
              if (!eslintPassed) comment += `- **ESLint**: Verifique os logs para problemas de estilo e qualidade do código\n`;
              if (!typesPassed) comment += `- **TypeScript**: Erros de tipo detectados - revise a saída do build\n`;
              if (!auditPassed) comment += `- **Segurança**: Execute \`npm audit\` localmente para ver as vulnerabilidades\n\n`;
              comment += `### 💡 Sugestões de Melhorias\n\n`;
              comment += `- ✅ Revise o guia de estilo do projeto para manter consistência\n`;
              comment += `- ✅ Use tipos explícitos ao invés de \`any\` para melhor segurança de tipo\n`;
              comment += `- ✅ Adicione comentários para funções complexas e lógica não óbvia\n`;
              comment += `- ✅ Considere adicionar testes unitários para novas funcionalidades\n`;
              comment += `- ✅ Verifique se há duplicação de código que pode ser refatorado\n`;
              comment += `- ✅ Mantenha funções pequenas e focadas em uma única responsabilidade\n`;
            } else {
              comment += `### ✨ Excelente Qualidade!\n`;
              comment += `Seu código passou em todas as verificações! 🎉 Pronto para review. `;
            }

            comment += `\n---\n`;
            comment += `*Análise automática realizada pelo Sistema de Revisão de Código AI do GitHub Actions*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  code-review-bot:
    name: 🤖 AI Code Reviewer
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Submit Review
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'COMMENT',
              body: '🤖 Review automático realizado. Este PR foi analisado pelas verificações de qualidade acima.'
            });

  code-analysis:
    name: Advanced Code Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'typescript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  pr-summary:
    name: Generate PR Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Summary
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            let summary = `## 📊 Resumo do PR\n\n`;
            summary += `**Alterações**: +${prData.additions} -${prData.deletions}\n`;
            summary += `**Arquivos Modificados**: ${prData.changed_files}\n`;
            summary += `**Commits**: ${prData.commits}\n\n`;
            summary += `✨ *Automatizado pelo Sistema de Revisão de Código AI do GitHub Actions*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
