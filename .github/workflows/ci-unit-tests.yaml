name: CI

on:
  pull_request:
    branches:
      - 'develop'

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "npm"
      
      - name: Run install Node.js
        run: |
          npm install

      - name: Run test
        run: |
          npm run test