reviews:
  enabled: true
  auto_review_on_small_pull_requests: true
  labeling_instructions: true
  auto_review:
    enabled: true
    drafts: false

max_files: 10
max_lines_per_file: 500

rules:
  - name: "Review PRs from story branches"
    patterns:
      source_branch: "*/story/*"
    enabled: true
    
  - name: "Review PRs from issue branches"
    patterns:
      source_branch: "*/issue/*"
    enabled: true

chat:
  enabled: true
  auto_reply: true

default:
  review:
    enabled: false
